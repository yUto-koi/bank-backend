server.port=${PORT:8080}

# Supabase > Project Settings > Database > Connection string (Session pooler) ကို JDBC ပုံစံပြောင်း၍ env var ထဲထည့်ပါ
# ဥပမာ: jdbc:postgresql://aws-0-xx.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5

# Table များကို schema.sql ဖြင့် ကိုယ်တိုင်ဆောက်ထားသဖြင့် Hibernate မပြင်စေရန်
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Vercel URL (ဥပမာ https://my-bank.vercel.app)။ စမ်းသပ်ချိန်တွင် * ထားနိုင်သည်
app.cors.origin=${CORS_ORIGIN:*}
